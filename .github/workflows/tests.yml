name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: node tests/desktop_clap_check.cjs
      - run: node tests/desktop_voice_check.cjs
      - run: node tests/desktop_standby_check.cjs
      - run: node tests/desktop_native_standby_check.cjs
      - run: node tests/desktop_app_check.cjs
      - run: node tests/desktop_dashboard_check.cjs
      - run: node --check web/app.js
